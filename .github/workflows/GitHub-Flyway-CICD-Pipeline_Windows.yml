# This is a basic workflow to help you get started with Actions

# ===========================
# Pipeline Name: GitHub-Flyway-CICD-Pipeline_Windows.yml
# Version: 1.0.0
# Author: Redgate Software Ltd
# Last Updated: 2025-05-06
# Last Update Notes: Disabled Flyway Pipelines by default
# Description: GitHub YAML Pipeline for Linux Runners
# ===========================
 
name: Flyway-Live-Release

on:
  push:
    branches:
      - main
    paths:
      - 'migrations/**'
      
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
env:
  # Enable this for additional debug logging
  ACTIONS_RUNNER_DEBUG: false

  ### Step 1: Define Environment Secrets ###
  ### Environment Secrets - Create Environment Secrets ###
  ### Navigate to Settings > Secrets & Variables > Actions
  # FLYWAY_EMAIL: Enter the email address linked to the Redgate Account that created the PAT
  # FLYWAY_TOKEN: Enter the PAT Value (This should be treated like a password and thus as a secure variable.
  # FLYWAY_AUTH_DISABLED: (Optional) - Create and set to true to skip the auth check stage
  # FLYWAY_CLI_INSTALL  (Optional) - Default is empty (Or false): Set as 'true' to enable a Flyway CLI validate and Install step
  # TARGET_DATABASE_USERNAME: Leave blank if using integratedSecurity (default).
  # TARGET_DATABASE_PASSWORD: Leave blank if using integratedSecurity (default).
  # CUSTOM_PARAMS: Optional - Used for passing custom Flyway Parameters to each Flyway command
  ### End of Environment Variables ###
  
  # Step 3: Authenticate Flyway with Personal Access Tokens (PATs)
  # Details on how to do this can be found here: https://documentation.red-gate.com/flyway/flyway-cli-and-api/tutorials/tutorial-personal-access-tokens
  # Documentation on all available Authentication methods can be found here: https://documentation.red-gate.com/fd/flyway-licensing-263061944.html
  FLYWAY_EMAIL: "${{ secrets.FLYWAY_EMAIL }}" # Enter the email address linked to the Redgate Account that created the PAT
  FLYWAY_TOKEN: "${{ secrets.FLYWAY_TOKEN }}" # Enter the PAT Value (This should be treated like a password and thus as a secure variable.
  FLYWAY_AUTH_DISABLED: "${{ secrets.FLYWAY_AUTH_DISABLED }}" # Create and set to true to skip the auth check stage, useful when Offline Permits are in use instead.

  
  BASELINE_VERSION: "001" # This should match the version number of your baseline script
  FIRST_UNDO_SCRIPT: "002" # This should match the first undo version in your project

  # Optional: Validate Flyway CLI installation for ephemeral agents.
  FLYWAY_CLI_INSTALL_CHECK: "${{ secrets.FLYWAY_CLI_INSTALL }}" # Setting to false will skip the Flyway CLI check step
  FLYWAY_VERSION: "Latest" # This outlines the version of Flyway CLI that will be downloaded if no Flyway CLI is detected on the target agent (Examples - '11.0.0' for specific version. Or 'Latest' for latest version)
  FLYWAY_INSTALL_DIRECTORY: "C:\\FlywayCLI\\" # The path on the agent machine where Flyway CLI will be installed  

  # Optional: Side Quest #1 - Enable Flyway Pipeline Integration for tracking releases and drift. - https://flyway.red-gate.com/
  FLYWAY_PUBLISH_RESULT: "false" # Set this value to true to enable Flyway Pipelines and track your releases centrally!
  FLYWAY_DRIFT_ON_MIGRATE: "true" # Set this value to true to enable Flyway Pipelines drift detection and track your drift centrally!
 
### DO NOT EDIT BELOW THIS LINE - All variables set in the above section will be consumed by the jobs below and therefore do not require any updates to function ###

jobs:
  build:
    permissions:
      checks: write
      contents: read
    name: Deploy Build
    # The type of runner that the job will run on
    runs-on: huxLocal # GitHub-hosted Windows runner; Flyway CLI is installed via Chocolatey in the first step
    environment: 'build'
    env:
      stage: 'Build'
      displayName: 'Build'
      DATABASE_NAME: 'Chinook_Build'
      ENVIRONMENT: 'Build' # This variable refers to the environment name present in the Flyway Projects TOML file.
      AZURE_SQL_SERVER: 'localhost'
      TARGET_DATABASE_USERNAME: "${{ secrets.TARGET_DATABASE_USERNAME }}"
      TARGET_DATABASE_PASSWORD: "${{ secrets.TARGET_DATABASE_PASSWORD }}"
      REPORT_DATABASE_USERNAME: "${{ secrets.REPORT_DATABASE_USERNAME || secrets.TARGET_DATABASE_USERNAME }}"
      REPORT_DATABASE_PASSWORD: "${{ secrets.REPORT_DATABASE_PASSWORD || secrets.TARGET_DATABASE_PASSWORD }}"
      CUSTOM_PARAMS: "${{ secrets.CUSTOM_PARAMS }}" # Secure method of adding custom Flyway Parameters (Example -X for debug)
      EXECUTE_BUILD: 'true' # Turn to false to skip the build stage tasks
      publishArtifacts: 'true' # Turn to false to skip the artifact upload
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Install Flyway CLI
        shell: pwsh
        env:
          FLYWAY_VERSION: ${{ env.FLYWAY_VERSION }}
          FLYWAY_INSTALL_DIRECTORY: ${{ env.FLYWAY_INSTALL_DIRECTORY }}
        run: |
          & "${{ github.workspace }}\Scripts\Flyway_DownloadAndInstallCLI.ps1"
          "${{ env.FLYWAY_INSTALL_DIRECTORY }}" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
     
      # Step 2 - Migrate all scripts from the migration folder, to verify they can be deployed against an empty database. This is the quickest way to get feedback about problematic scripts
      - name: Validate Migrate Scripts
        if: ${{ env.EXECUTE_BUILD == 'true' && success() }}
        run: |
          flyway info migrate info -environment="${{ env.ENVIRONMENT }}" -cleanDisabled=false -user="${{ env.TARGET_DATABASE_USERNAME }}" -password="${{ env.TARGET_DATABASE_PASSWORD }}" -baselineOnMigrate=true -configFiles="${{ GITHUB.WORKSPACE }}\flyway.toml" -locations="filesystem:${{ GITHUB.WORKSPACE }}\migrations" "-reportEnabled=${{ env.FLYWAY_PUBLISH_RESULT }}" ${{ env.CUSTOM_PARAMS }}
      # Step 2a - Create Check Report (Drift Detection - Using Deployed Snapshot)
      - name: Flyway Check Report - Dryrun
        if: ${{ env.EXECUTE_BUILD == 'true' && success() }}
        run: |
          flyway check -dryrun -environment="Build" -user="${{ env.TARGET_DATABASE_USERNAME }}" -password="${{ env.TARGET_DATABASE_PASSWORD }}" -configFiles="${{ GITHUB.WORKSPACE }}\flyway.toml" -locations="filesystem:${{ GITHUB.WORKSPACE }}\migrations" "-reportFilename=${{ GITHUB.WORKSPACE }}\reports\${{ env.DATABASE_NAME }}-CI-Run-${{ GITHUB.RUN_ID }}-Check-Report.html" "-reportEnabled=true" "-check.rulesLocation=${{ GITHUB.WORKSPACE }}\rules" ${{ env.CUSTOM_PARAMS }}
      # Step 2b - Create Check Report (Changes and Code Analysis)
      - name: Flyway Check Report - Code Analysis
        if: ${{ env.EXECUTE_BUILD == 'true' && success() }}
        run: |
          flyway check -changes -code -environment="Test" -user="${{ env.TARGET_DATABASE_USERNAME }}" -password="${{ env.TARGET_DATABASE_PASSWORD }}" "-check.buildEnvironment=Build" "-environments.Build.user=${{ env.TARGET_DATABASE_USERNAME }}" "-environments.Build.password=${{ env.TARGET_DATABASE_PASSWORD }}" -configFiles="${{ GITHUB.WORKSPACE }}\flyway.toml" -locations="filesystem:${{ GITHUB.WORKSPACE }}\migrations" "-reportFilename=${{ GITHUB.WORKSPACE }}\reports\${{ env.DATABASE_NAME }}-CI-Run-${{ GITHUB.RUN_ID }}-Check-Report.html" "-check.rulesLocation=${{ GITHUB.WORKSPACE }}\rules" "-check.rulesConfig=${{ GITHUB.WORKSPACE }}\sqlfluff.cfg" "-reportEnabled=true" ${{ env.CUSTOM_PARAMS }}
      # Step 3 - Install Unit Tests via Flyway Prepare Deploy
      - name: Flyway - Install Unit Tests
        if: ${{ env.EXECUTE_BUILD == 'true' && success() }}
        run: |
          flyway prepare deploy -environment="Build" -user="${{ env.TARGET_DATABASE_USERNAME }}" -password="${{ env.TARGET_DATABASE_PASSWORD }}" -workingDirectory="${{ GITHUB.WORKSPACE }}\UnitTests" "-prepare.source=schemaModel" "-prepare.target=Build" "-prepare.types=deploy" "-prepare.scriptFilename=${{ GITHUB.WORKSPACE }}\UnitTests\Artifact\D_${{ env.SCRIPT_FILENAME }}" "-prepare.force=true" -configFiles="${{ GITHUB.WORKSPACE }}\UnitTests\flyway.toml" -schemaModelLocation="${{ GITHUB.WORKSPACE }}\UnitTests\schema-model"
    # Step 9 - Check Test Count
      - name: Check Test Count
        if: ${{ env.EXECUTE_BUILD == 'true' && success() }}
        continue-on-error: true
        shell: pwsh
        run: |
          Install-Module -Name SqlServer -Force -AllowClobber -Scope CurrentUser
          $query = "SELECT COUNT(*) AS TestCount FROM tSQLt.Tests"
          $result = Invoke-Sqlcmd -ServerInstance "${{ env.AZURE_SQL_SERVER }}" -Database "${{ env.DATABASE_NAME }}" -TrustServerCertificate -Query $query
          Write-Host "Found $($result.TestCount) tSQLt test(s)"
          if ($result.TestCount -eq 0) {
              Write-Host "::warning::No tests found!"
          }

      # Step 10 - Run tSQLt Tests
      - name: Run tSQLt Tests
        if: ${{ env.EXECUTE_BUILD == 'true' && success() }}
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-Sqlcmd -ServerInstance "${{ env.AZURE_SQL_SERVER }}" -Database "${{ env.DATABASE_NAME }}" -TrustServerCertificate -Query "BEGIN TRY EXEC tSQLt.RunAll END TRY BEGIN CATCH END CATCH; EXEC tSQLt.XmlResultFormatter" -MaxCharLength 1000000 | %{ $out = $out + $_[0]}; $out > "${{ GITHUB.WORKSPACE }}\UnitTests\TestResults\DatabaseTestResults.junit.xml"

      # Step 3c - Publish Test Results as Artifact
      - name: Publish Test Results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: tsqlt-test-results-${{ github.run_number }}
          path: ${{ GITHUB.WORKSPACE }}\UnitTests\TestResults\DatabaseTestResults.junit.xml
      # Step 4 - Publish Check Report as Artifact
      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: tSQLt Test Results
          path: UnitTests/TestResults/DatabaseTestResults.junit.xml
          reporter: java-junit
          fail-on-error: false
      - name: Publish Check Report as Artifact
        if: ${{ env.EXECUTE_BUILD == 'true' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: flyway-reports-build
          path: ${{ GITHUB.WORKSPACE }}\reports\${{ env.DATABASE_NAME }}-CI-Run-${{ GITHUB.RUN_ID }}-Check-Report.html
      # GitHub - After migration scripts are validated, publish them as an artifact
      - name: Publish Validated Migration Scripts as Artifact
        if: ${{ env.publishArtifacts == 'true' && success() }}
        uses: actions/upload-artifact@v4
        with: 
          name: flyway-build-artifact-${{ github.run_number }}
          path: |
              !${{ GITHUB.WORKSPACE }}\flyway-*\**\*
              !${{ GITHUB.WORKSPACE }}\.git\**\*
              !${{ GITHUB.WORKSPACE }}\.git*\**\*
              ${{ GITHUB.WORKSPACE }}\**\schema-model\**\*
              ${{ GITHUB.WORKSPACE }}\**\migrations\**\*
              ${{ GITHUB.WORKSPACE }}\**\reports\**\*
              ${{ GITHUB.WORKSPACE }}\**\backups\**\*
              ${{ GITHUB.WORKSPACE }}\**\flyway.toml
              ${{ GITHUB.WORKSPACE }}\**\Filter.scpf

  test:
    name: Deploy Test
    # The type of runner that the job will run on
    runs-on: huxLocal # GitHub-hosted Windows runner
    environment: 'test' # This refers to GitHub's Environment name
    if: ${{ true }} #Set this variable to false to temporarily disable the job
    needs: build
    env:
      stage: 'Test'
      DATABASE_NAME: "Chinook_Test"
      ENVIRONMENT: "Test" # Refers to the environment in the Flyway Project TOML file.
      TARGET_DATABASE_USERNAME: "${{ secrets.TARGET_DATABASE_USERNAME }}"
      TARGET_DATABASE_PASSWORD: "${{ secrets.TARGET_DATABASE_PASSWORD }}"
      REPORT_ENVIRONMENT: "Check"
      REPORT_DATABASE_USERNAME: "${{ secrets.TARGET_DATABASE_USERNAME }}" # Optional - Change to a different secret if the connection details for the report database differs from the target
      REPORT_DATABASE_PASSWORD: "${{ secrets.TARGET_DATABASE_PASSWORD }}" # Optional - Change to a different secret if the connection details for the report database differs from the target
      CUSTOM_PARAMS: "${{ secrets.CUSTOM_PARAMS }}" # Secure method of adding custom Flyway Parameters (Example -X for debug)
      generateReport: 'true' # Turn to false to skip the CHECK report stage tasks
      FLYWAY_CHECK_DRIFT_ON_MIGRATE: 'true' # Turn to false to skip the Drift Report upload to Flyway Pipelines (If enabled)
    steps:
      - uses: actions/checkout@v4

      - name: Install Flyway CLI
        shell: pwsh
        env:
          FLYWAY_VERSION: ${{ env.FLYWAY_VERSION }}
          FLYWAY_INSTALL_DIRECTORY: ${{ env.FLYWAY_INSTALL_DIRECTORY }}
        run: |
          & "${{ github.workspace }}\Scripts\Flyway_DownloadAndInstallCLI.ps1"
          "${{ env.FLYWAY_INSTALL_DIRECTORY }}" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Create Check Reports
        if: ${{ env.generateReport == 'true' && success() }}
        run: |
          flyway check -dryrun -changes -drift -environment="${{ env.ENVIRONMENT }}" -user="${{ env.TARGET_DATABASE_USERNAME }}" -password="${{ env.TARGET_DATABASE_PASSWORD }}" -cleanDisabled=false -configFiles="${{ GITHUB.WORKSPACE }}\flyway.toml" -locations="filesystem:${{ GITHUB.WORKSPACE }}\migrations" "-check.buildEnvironment=Check" "-environments.Check.user=${{ env.TARGET_DATABASE_USERNAME }}" "-environments.Check.password=${{ env.TARGET_DATABASE_PASSWORD }}" "-reportFilename=${{ GITHUB.WORKSPACE }}\reports\${{ env.DATABASE_NAME }}-Run-${{ GITHUB.RUN_ID }}-${{ env.ENVIRONMENT }}-Check-Report.html" "-publishResult=${{ env.FLYWAY_PUBLISH_RESULT }}" "-flywayServicePublish.publishReport=${{ env.FLYWAY_PUBLISH_RESULT }}" "-reportEnabled=${{ env.FLYWAY_PUBLISH_RESULT }}" ${{ env.CUSTOM_PARAMS }}
        continue-on-error: true
      # Step 3 - Publish Check Report
      - name: Publish Check Report as Artifact
        if: ${{ env.generateReport == 'true' && success() }}
        uses: actions/upload-artifact@v4
        with: 
          name: flyway-reports-test
          path: ${{ GITHUB.WORKSPACE }}\reports\${{ env.DATABASE_NAME }}-Run-${{ GITHUB.RUN_ID }}-${{ env.ENVIRONMENT }}-Check-Report.html    
      # Step 4 - Deploy pending migrations to target database
      - name: Migrate Test DB
        if: success()
        run: |
          flyway info migrate info -environment="${{ env.ENVIRONMENT }}" -user="${{ env.TARGET_DATABASE_USERNAME }}" -password="${{ env.TARGET_DATABASE_PASSWORD }}" -baselineOnMigrate="true" -configFiles="${{ GITHUB.WORKSPACE }}\flyway.toml" -locations="filesystem:${{ GITHUB.WORKSPACE }}\migrations" "-publishResult=${{ env.FLYWAY_PUBLISH_RESULT }}" "-flywayServicePublish.publishReport=${{ env.FLYWAY_PUBLISH_RESULT }}" "-reportEnabled=${{ env.FLYWAY_PUBLISH_RESULT }}" ${{ env.CUSTOM_PARAMS }}

  prod:
    name: Deploy Prod
    # The type of runner that the job will run on
    runs-on: huxLocal # GitHub-hosted Windows runner
    environment: 'prod'
    if: ${{ true }}
    needs: test
    env:
      stage: 'Prod'
      DATABASE_NAME: "Chinook"
      ENVIRONMENT: "Prod" # Refers to the environment name in the Flyway Project TOML file.
      TARGET_DATABASE_URL: "${{ secrets.TARGET_DATABASE_URL }}"
      TARGET_DATABASE_USERNAME: "${{ secrets.TARGET_DATABASE_USERNAME }}"
      TARGET_DATABASE_PASSWORD: "${{ secrets.TARGET_DATABASE_PASSWORD }}"
      REPORT_ENVIRONMENT: "Check"
      REPORT_DATABASE_USERNAME: "${{ secrets.TARGET_DATABASE_USERNAME }}" # Optional - Change to a different secret if the connection details for the report database differs from the target
      REPORT_DATABASE_PASSWORD: "${{ secrets.TARGET_DATABASE_PASSWORD }}" # Optional - Change to a different secret if the connection details for the report database differs from the target
      CUSTOM_PARAMS: "${{ secrets.CUSTOM_PARAMS }}" # Secure method of adding custom Flyway Parameters (Example -X for debug)
      generateReport: 'true' # Turn to false to skip the CHECK report stage tasks
      FLYWAY_CHECK_DRIFT_ON_MIGRATE: 'true' # Turn to false to skip the Drift Report upload to Flyway Pipelines (If enabled)

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v4

      - name: Install Flyway CLI
        shell: pwsh
        env:
          FLYWAY_VERSION: ${{ env.FLYWAY_VERSION }}
          FLYWAY_INSTALL_DIRECTORY: ${{ env.FLYWAY_INSTALL_DIRECTORY }}
        run: |
          & "${{ github.workspace }}\Scripts\Flyway_DownloadAndInstallCLI.ps1"
          "${{ env.FLYWAY_INSTALL_DIRECTORY }}" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Create Check Reports
        if: ${{ env.generateReport == 'true' && success() }}
        run: |
          flyway check -dryrun -changes -code -drift -environment="${{ env.ENVIRONMENT }}" -user="${{ env.TARGET_DATABASE_USERNAME }}" -password="${{ env.TARGET_DATABASE_PASSWORD }}" -cleanDisabled=false -configFiles="${{ GITHUB.WORKSPACE }}\flyway.toml" -locations="filesystem:${{ GITHUB.WORKSPACE }}\migrations" "-check.buildEnvironment=Check" "-environments.Check.user=${{ env.TARGET_DATABASE_USERNAME }}" "-environments.Check.password=${{ env.TARGET_DATABASE_PASSWORD }}" "-reportFilename=${{ GITHUB.WORKSPACE }}\reports\${{ env.DATABASE_NAME }}-Run-${{ GITHUB.RUN_ID }}-${{ env.ENVIRONMENT }}-Check-Report.html" "-publishResult=${{ env.FLYWAY_PUBLISH_RESULT }}" "-flywayServicePublish.publishReport=${{ env.FLYWAY_PUBLISH_RESULT }}" "-reportEnabled=${{ env.FLYWAY_PUBLISH_RESULT }}" ${{ env.CUSTOM_PARAMS }}
        continue-on-error: true
      # Step 3 - Publish Check Report
      - name: Publish Check Report as Artifact
        if: ${{ env.generateReport == 'true' && success() }}
        uses: actions/upload-artifact@v4
        with: 
          name: flyway-reports-prod
          path: ${{ GITHUB.WORKSPACE }}\reports\${{ env.DATABASE_NAME }}-Run-${{ GITHUB.RUN_ID }}-${{ env.ENVIRONMENT }}-Check-Report.html
      # Step 4 - Deploy pending migrations to target database
      - name: Migrate Production DB
        if: success()
        run: |
          flyway info migrate info -environment="${{ env.ENVIRONMENT }}" -user="${{ env.TARGET_DATABASE_USERNAME }}" -password="${{ env.TARGET_DATABASE_PASSWORD }}" -baselineOnMigrate="true" -configFiles="${{ GITHUB.WORKSPACE }}\flyway.toml" -locations="filesystem:${{ GITHUB.WORKSPACE }}\migrations" "-publishResult=${{ env.FLYWAY_PUBLISH_RESULT }}" "-flywayServicePublish.publishReport=${{ env.FLYWAY_PUBLISH_RESULT }}" "-reportEnabled=${{ env.FLYWAY_PUBLISH_RESULT }}" ${{ env.CUSTOM_PARAMS }}
