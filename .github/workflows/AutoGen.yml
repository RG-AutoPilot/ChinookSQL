name: Auto-generate Flyway Migration Script

on:
  pull_request:
    paths:
      - 'schema-model/**'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  generate-migration:
    runs-on: huxLocal  # Or 'self-hosted' or 'ubuntu-latest' if preferred
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}  # For push access

      # Set up Flyway CLI if not already on the runner
      # If your runner already has Flyway, skip this step
      #- name: Download and install Flyway CLI
      #  run: |
      #    curl -L -o flyway.zip https://download.red-gate.com/maven/release/org/flywaydb/flyway-commandline/10.20.0/flyway-commandline-10.20.0-windows-x64.zip
      #    tar -xf flyway.zip
      #    echo "${{ github.workspace }}\flyway-10.20.0" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      #  shell: pwsh

      # Run your Flyway diff/generate command
      # --- Adapt these commands/params for your structure as needed
      - name: Generate Flyway migration script
        run: |
            $ARTIFACT_FILENAME = "${{ GITHUB.WORKSPACE }}\Flyway.Migrations.differences-$(get-date -f yyyyMMdd).zip"  # Output file for generated migrations
            $WORKING_DIRECTORY = "${{ GITHUB.WORKSPACE }}"  # Path to Flyway project root
            $SOURCE_ENVIRONMENT = "schemaModel"  # Source environment name (desired state)
            $TARGET_ENVIRONMENT = "migrations"  # Target environment name (existing migrations)
            $BUILD_ENVIRONMENT = "shadow"  # Build database environment name for validation
            $BUILD_ENVIRONMENT_USERNAME = "Sa"  # Build database username (leave empty for flyway.toml)
            $BUILD_ENVIRONMENT_PASSWORD = "Redgate1"  # Build database password (use env variables in production)
            $FLYWAY_VERSION_DESCRIPTION = "FlywayCLI_AutomatedMigrationScript"  # Description for migration script filename
            
            # Calculate the differences between two entities (Databases/Folders & More) #
            flyway diff generate `
            "-diff.source=$SOURCE_ENVIRONMENT" `
            "-diff.target=$TARGET_ENVIRONMENT" `
            "-diff.buildEnvironment=$BUILD_ENVIRONMENT" `
            "-environments.$BUILD_ENVIRONMENT.user=$BUILD_ENVIRONMENT_USERNAME" `
            "-environments.$BUILD_ENVIRONMENT.password=$BUILD_ENVIRONMENT_PASSWORD" `
            "-diff.artifactFilename=$ARTIFACT_FILENAME" `
            "-generate.artifactFilename=$ARTIFACT_FILENAME" `
            "-generate.description=$FLYWAY_VERSION_DESCRIPTION" `
            "-generate.location=$WORKING_DIRECTORY\migrations" `
            "-generate.types=versioned,undo" `
            "-generate.addTimestamp=true" `
            -workingDirectory="$WORKING_DIRECTORY" `
            -schemaModelSchemas=""
        shell: pwsh

      # Commit and push generated migration back to same PR branch
      - name: Commit and push migration script back to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .\migrations\*.sql
          git commit -m "Auto-generated Flyway migration script for schema change [skip ci]" || echo "No changes to commit."
          git push origin HEAD:${{ github.head_ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
